[package]
name = "media_player"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.26.0", features = ["v4", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_millis = "0.1.1"
directories = "6.0.0"
thiserror = "2.0.20"
error-stack = { version = "0.8.0"}
iced = { version = "0.14.0", features = ["tokio"] }
iced_aw = { version = "0.14.1", features = ["full"]}
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
symphonia = { version = "0.6.1", features = ["all"] }
rodio = { version = "0.23.0", features = ["symphonia-all"] }
educe = "0.8.1"
rand = "0.10.3"